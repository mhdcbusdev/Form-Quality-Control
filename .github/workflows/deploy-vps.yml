name: Deploy to Biznet VPS

on:
  push:
    branches: [main]
    paths:
      - 'dashboard.html'
      - 'form.html'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BIZNET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.BIZNET_HOST }} >> ~/.ssh/known_hosts

      - name: Upload files to VPS
        run: |
          scp -i ~/.ssh/id_ed25519 dashboard.html ${{ secrets.BIZNET_USER }}@${{ secrets.BIZNET_HOST }}:/tmp/dashboard.html
          scp -i ~/.ssh/id_ed25519 form.html ${{ secrets.BIZNET_USER }}@${{ secrets.BIZNET_HOST }}:/tmp/form.html

      - name: Move files into place on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.BIZNET_USER }}@${{ secrets.BIZNET_HOST }} "
            sudo mv /tmp/dashboard.html /var/www/form-quality-control/dashboard.html &&
            sudo mv /tmp/form.html /var/www/form-quality-control/form.html &&
            sudo chown www-data:www-data /var/www/form-quality-control/dashboard.html /var/www/form-quality-control/form.html
          "
